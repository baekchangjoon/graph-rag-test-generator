# logging-injection.snippet.yml
#
# 각 서비스(A, B, C — 특히 C)에 아래 environment 를 주입하면:
#   1) Hibernate 5 와 6 의 SQL/bind 로그를 모두 켠다 (버전 모름 → 둘 다)
#   2) 로그 패턴에 %X(전체 MDC 덤프)를 넣어 trace-id 가 어떤 MDC 키로 박히는지 노출
#   3) stdout 인코딩을 UTF-8 로 통일 (한글 바인드 깨짐 방지)
#
# 핵심: LOGGING_LEVEL_* env 는 로거 이름의 대소문자를 잃어 org.hibernate.SQL 이 안 켜진다.
#       → 반드시 SPRING_APPLICATION_JSON(JSON, 대소문자 보존) 으로 주입한다.
#
# docker-compose.override.yml 에 서비스별로 병합하세요 (기존 environment 와 합쳐짐).

services:
  # 실제 서비스 이름(legacy-a / legacy-b / legacy-c 등)으로 바꿔 적용
  legacy-c:
    environment:
      # (1)+(2) 로그레벨 + 패턴. JSON 한 줄. 기존 SPRING_APPLICATION_JSON 이 있으면 키를 병합하세요.
      SPRING_APPLICATION_JSON: >-
        {"logging.level.org.hibernate.SQL":"DEBUG",
         "logging.level.org.hibernate.type.descriptor.sql.BasicBinder":"TRACE",
         "logging.level.org.hibernate.orm.jdbc.bind":"TRACE",
         "logging.pattern.level":"%5p [%X]"}
      # (3) 인코딩. 기존 JAVA_TOOL_OPTIONS 가 있으면(예: -javaagent) 뒤에 이어붙이세요.
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8"

  # A, B 에도 같은 environment 를 주면 전파 경로를 단계별로 추적할 수 있습니다(권장).
  # legacy-a: { environment: { ...위와 동일... } }
  # legacy-b: { environment: { ...위와 동일... } }
