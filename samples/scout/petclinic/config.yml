# scout-launcher sample — spring-petclinic + Postgres
#
# Prereqs (one-time):
#   1) cd ~/github_jdbc-intercept-agent/jdbc-intercept-agent && ./gradlew publishToMavenLocal
#   2) cd ~/graph-rag/graph-rag && ./gradlew -Pagent.enabled=true \
#         :shared-model:publishToMavenLocal \
#         :graph-rag-builder:publishToMavenLocal
#   3) Build spring-petclinic SUT jar:
#        cd ~/github_spring-petclinic/spring-petclinic && mvn -DskipTests package
#
# Run:
#   ./gradlew :scout-launcher:installDist
#   ./scout-launcher/build/install/scout-launcher/bin/scout-launcher \
#       samples/scout/petclinic/config.yml

sut:
  jar: ${HOME}/github_spring-petclinic/spring-petclinic/target/spring-petclinic-4.0.0-SNAPSHOT.jar
  args:
    - --server.port=8084
    - --spring.profiles.active=postgres
    - --spring.datasource.url=jdbc:postgresql://localhost:55432/petclinic
    - --spring.datasource.username=appuser
    - --spring.datasource.password=apppass
    - --spring.datasource.driver-class-name=org.postgresql.Driver

  jvm-args:
    - -Xmx512m

  # jdbc-intercept-agent attaches via -javaagent and reads our bridge from boot classpath.
  agents:
    - ${HOME}/.m2/repository/io/jdbcintercept/agent-core/1.0.0-SNAPSHOT/agent-core-1.0.0-SNAPSHOT.jar

  # graph-rag bridge + its deps go on the boot classpath so the agent's ServiceLoader can
  # discover JdbcAgentBaggageBridge (which writes the archive on shutdown).
  # opentelemetry-api + opentelemetry-context are auto-prepended by the launcher when
  # otel.enabled=true below; no need to list them here.
  boot-classpath:
    - ${HOME}/.m2/repository/io/graphrag/graph-rag-builder/0.1.0-SNAPSHOT/graph-rag-builder-0.1.0-SNAPSHOT.jar
    - ${HOME}/.m2/repository/io/graphrag/shared-model/0.1.0-SNAPSHOT/shared-model-0.1.0-SNAPSHOT.jar
    - ${HOME}/.m2/repository/io/jdbcintercept/agent-api/1.0.0-SNAPSHOT/agent-api-1.0.0-SNAPSHOT.jar

  health-check:
    url: http://localhost:8084/actuator/health
    timeout-seconds: 60
    interval-millis: 1000

  # OTEL javaagent restores the inbound `baggage:` header (set by HttpScout) onto the
  # Tomcat handler thread so the bridge can read graphrag.path-id during JDBC calls.
  # The launcher auto-downloads opentelemetry-javaagent.jar + opentelemetry-api.jar
  # + opentelemetry-context.jar into ~/.cache/graphrag-scout/ on first run.
  otel:
    enabled: true

dependencies:
  docker-compose:
    file: ./samples/scout/petclinic/docker-compose.yml
    wait-for-healthy: true
    teardown-on-exit: true
    health-timeout-seconds: 120

scout:
  base-url: http://localhost:8084
  steps:
    - path-id: list-owners
      method: GET
      path: /api/owners
    - path-id: get-owner-1
      method: GET
      path: /api/owners/1
    - path-id: list-vets
      method: GET
      path: /api/vets

output:
  archive-dir: /tmp/graph-rag-scout/petclinic-archive
  clear-before-run: true
  # project name is embedded into endpoints.json and used by test-generator
  # for package/class naming hints.
  project: petclinic
