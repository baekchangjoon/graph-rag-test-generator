# docker-compose for the scout-launcher's dependencies stage.
# Petclinic only needs Postgres; the previous Redis + Kafka illustrative
# extras were dropped because the upstream `bitnami/kafka:3.7` tag was
# deprecated in 2026 and the orchestrator E2E doesn't exercise them.
services:
  postgres:
    image: postgres:16-alpine
    container_name: graphrag-scout-pg
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: petclinic
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d petclinic"]
      interval: 2s
      timeout: 3s
      retries: 20
