server: { port: 8080 }
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/reservationdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpw}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
eventuate:
  b3:
    fallback: ${EVENTUATE_B3_FALLBACK:false}
management: { endpoints: { web: { exposure: { include: health } } } }
# Eventuate Kafka/JDBC: eventuatelocal.kafka.bootstrap.servers 등은 env로 주입(compose에서).
# eventuate.database.schema defaults to 'eventuate' — infra tables (message, received_messages,
# offset_store, cdc_monitoring) live in the 'eventuate' MySQL schema (see mysql/init.sql).
