name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # graph-rag-builder depends on io.jdbcintercept:agent-api/agent-core via mavenLocal()
      # (docs/19 — jdbc-intercept-agent bridge). Clone + publish before building graph-rag.
      - name: Checkout jdbc-intercept-agent
        uses: actions/checkout@v4
        with:
          repository: baekchangjoon/jdbc-intercept-agent
          path: jdbc-intercept-agent
          ref: main

      - name: Publish jdbc-intercept-agent to Maven Local
        run: |
          cd jdbc-intercept-agent/jdbc-intercept-agent
          ./gradlew publishToMavenLocal --no-daemon --stacktrace -x test

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
