name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Note: graph-rag-builder + samples/demo-sut have an optional integration with
      # io.jdbcintercept:agent-{api,core} (docs/19). The agent lives in a separate repo
      # and is currently private — CI builds graph-rag WITHOUT the agent integration
      # (default behavior; see -Pagent.enabled in graph-rag-builder/build.gradle.kts).
      # Local developers run with -Pagent.enabled=true after publishToMavenLocal in agent repo.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
