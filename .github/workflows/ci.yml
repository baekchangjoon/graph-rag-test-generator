name: ci

on:
  push:
    branches: [main, phase0]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # check를 샤드로 분할해 별도 러너에서 병렬 실행(직렬 ~85분 → 가장 느린 샤드 기준).
  # 분류 체계: docs/05-testing.md 참고.
  #  - unit  = in-process · Docker 불필요 (excludeTags=integration,docker)
  #  - docker= in-process · 단일 컨테이너 컴포넌트 테스트 (includeTags=docker)
  #  - it-*  = integration(풀-SUT 부팅) 무거운 테스트 (includeTags=integration)
  check:
    name: check (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit
            args: "check -PexcludeTags=integration,docker"
          # Docker 데몬을 요구하는 컴포넌트 테스트(Testcontainers DB/Kafka, samples SUT slice).
          - name: docker
            args: "test -PincludeTags=docker"
          # it-cli(cli 통합)를 무거운 OTEL 풀빌드 2개와 가벼운 것들로 분할.
          # LlmOracleE2E는 오프라인(커밋 캐시) E2E — CI에 포함해 LLM 캐시 키 drift(Spoon 핸들러
          # 직렬화 변경 시 무효화)를 조기에 잡는다. API 키 불필요.
          - name: it-cli-light
            args: ":graph-rag-builder:test -PincludeTags=integration --tests 'io.graphrag.builder.cli.BuilderIntegrationTest' --tests 'io.graphrag.builder.cli.BuilderEndpointSelectorIntegrationTest' --tests 'io.graphrag.builder.cli.LlmOracleE2E'"
          - name: it-cli-otel
            args: ":graph-rag-builder:test -PincludeTags=integration --tests 'io.graphrag.builder.cli.BuilderCollectionIntegrationTest' --tests 'io.graphrag.builder.cli.OtelKafkaBuildIntegrationTest'"
          - name: it-rest
            args: ":graph-rag-builder:test -PincludeTags=integration --tests 'io.graphrag.builder.capture.*' --tests 'io.graphrag.builder.coverage.*'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # gradle.properties의 로컬 java.home을 러너의 JDK로 덮어쓴다
      - name: Tests (${{ matrix.shard.name }})
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: ./gradlew ${{ matrix.shard.args }}

  e2e:
    runs-on: ubuntu-latest
    # check에 의존하지 않는다: e2e는 run-e2e.sh에서 자체 jar를 빌드/탐색/실행하는 독립 풀사이클이라
    # check 샤드와 병렬로 돌려도 안전하다. 직렬(needs: check)이면 e2e(~5분)가 check phase(~7분) 뒤에
    # 붙어 총 wall-clock이 ~12분이 되지만, 병렬이면 총합 = max(check, e2e, docker) ≈ 7분.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Full cycle (explore + generate + run)
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: ./e2e/run-e2e.sh

  # REQ-007: Spring Cloud Gateway 프록시 스모크. run-gateway-e2e.sh가 gateway-service bootJar 빌드 +
  # 다운스트림 WireMock 스텁 + 빌더 탐색/생성/실행을 자체 풀사이클로 돌린다(e2e job과 동형, 독립 병렬).
  gateway-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Gateway proxy smoke (discover + generate + run)
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: ./e2e/run-gateway-e2e.sh

  # 프로젝트 자체 테스트 커버리지(제품 모듈 집계)를 측정해 PR에 리포트한다. 정보성(non-blocking):
  # release.needs에 넣지 않고 임계값 게이트도 두지 않는다. 분류 체계: docs/05-testing.md "커버리지" 절.
  # 측정 범위 = unit + docker(=excludeTags=integration). integration(풀-SUT)·e2e(out-of-process)는
  # 무겁고/단일 러너 직렬·flaky해서 제외(코멘트/문서에 명시). 더 정확히는 check 샤드의 exec를
  # 아티팩트로 합치는 방식이 있으나 범위 밖. PR에서만 돈다.
  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Aggregate self-test coverage (unit + docker)
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: ./gradlew jacocoAggregatedReport -PexcludeTags=integration
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/reports/jacoco/jacocoAggregatedReport/html
          if-no-files-found: warn
      - name: Comment coverage on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          XML=build/reports/jacoco/jacocoAggregatedReport/jacocoAggregatedReport.xml
          MARKER='<!-- jacoco-coverage -->'
          SUMMARY="$(python3 .github/scripts/coverage_summary.py "$XML" 'unit + docker (integration·e2e 제외)')"
          BODY="$MARKER"$'\n'"$SUMMARY"
          printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"
          CID="$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi

  # builder Docker 이미지가 컨테이너 안에서 Testcontainers + SUT로 graph.json을 만드는지 검증(D-E2E-2).
  # Linux 전용(--network host)이라 ubuntu 러너에서만 의미가 있어 PR에서만 돈다.
  dind-builder-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Builder image E2E (Testcontainers-in-container)
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: ./e2e/run-dind-builder-e2e.sh

  # 실행 환경 서비스 이미지(test-state-dashboard, socket-mock-server)가 부팅·응답하는지 검증(D-E2E-3).
  service-image-boot-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Execution-env service images boot
        env:
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: ./e2e/run-service-image-boot-e2e.sh

  # vX.Y.Z(-prerelease) 태그 push 시에만, 모든 검증 통과 후 distZip + testlib jar + OTEL agent를 Release에
  # 첨부하고 4개 Docker 이미지(generator·builder·dashboard·socket-mock)를 GHCR에 push한다.
  release:
    runs-on: ubuntu-latest
    needs: [check, e2e, gateway-e2e, dind-builder-e2e, service-image-boot-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag is vX.Y.Z(-prerelease)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z(-prerelease)"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distributions + testlib jar
        env:
          TAG: ${{ github.ref_name }}
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: |
          export RELEASE_VERSION="${TAG#v}"
          ./gradlew :graph-rag-builder:distZip :test-generator:distZip :testlib:jar
      - name: Build and push images (GHCR)
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: |
          V="${TAG#v}"
          ./gradlew :test-generator:installDist :graph-rag-builder:installDist \
                    :test-state-dashboard:bootJar :socket-mock-server:bootJar
          REPO="ghcr.io/${OWNER,,}"   # GHCR는 소문자만 허용
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # CLI 이미지 — 컨텍스트=repo 루트, installDist 산출물 COPY
          for m in test-generator graph-rag-builder; do
            docker build -f "docker/$m.Dockerfile" -t "$REPO/$m:$V" -t "$REPO/$m:latest" .
            docker push "$REPO/$m:$V"
            docker push "$REPO/$m:latest"
          done
          # 실행 환경 서비스 이미지 — 컨텍스트=모듈 디렉터리, bootJar COPY(기존 Dockerfile)
          for m in test-state-dashboard socket-mock-server; do
            docker build -t "$REPO/$m:$V" -t "$REPO/$m:latest" "$m"
            docker push "$REPO/$m:$V"
            docker push "$REPO/$m:latest"
          done
      - name: Create GitHub Release and upload assets
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GRADLE_OPTS: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
        run: |
          V="${TAG#v}"
          ./gradlew :e2e:copyOtelAgent   # 생성 테스트 실행 환경이 SUT에 붙이는 OTEL agent
          gh release create "$TAG" --title "$TAG" --generate-notes \
            "graph-rag-builder/build/distributions/graph-rag-builder-$V.zip" \
            "test-generator/build/distributions/test-generator-$V.zip" \
            "testlib/build/libs/testlib-$V.jar" \
            "e2e/agents/otel-javaagent.jar"
