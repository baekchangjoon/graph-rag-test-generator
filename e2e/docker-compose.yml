# Phase 0 테스트 실행 환경 (docs/06). 도구 1의 분석 환경과는 별개.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "56432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  # 생성 Kafka 테스트(OrderEventConsumer 회귀)용 broker. KRaft 단일 노드, dual-listener:
  # INTERNAL(kafka:9092)=app 컨테이너, EXTERNAL(localhost:59092)=호스트의 생성 테스트.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "59092:59092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:59092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  app:
    build: ../samples/order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: order-service
      # 테스트 발행이 consumer 파티션 할당보다 빨라도 누락 안 되게(offset race 예방)
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      DDL_AUTO: create
      # 헤더 강제 SUT(B6) 회귀용. 미설정이면 false → 인터셉터 비활성(기존 동작 불변).
      REQUIRE_AUTH_TIME: ${REQUIRE_AUTH_TIME:-false}
      # 외부 의존은 mock 컨테이너로 redirect (docs/06)
      EXTERNAL_INVENTORY_URL: http://wiremock:8080
      # OTEL javaagent: baggage propagation만 사용 (트레이스 저장 없음)
      JAVA_TOOL_OPTIONS: "-javaagent:/agents/otel-javaagent.jar"
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_SERVICE_NAME: order-service
    volumes:
      - ./agents:/agents:ro
    ports:
      - "58080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
      kafka:
        condition: service_started

  wiremock:
    image: wiremock/wiremock:3.13.0
    command: ["--global-response-templating"]
    ports:
      - "59091:8080"

  socket-mock:
    build: ../socket-mock-server
    ports:
      - "59099:9099"
      - "59000:9000"

  test-state-dashboard:
    build: ../test-state-dashboard
    environment:
      DASHBOARD_TTL_SECONDS: "300"
    ports:
      - "58099:8080"
