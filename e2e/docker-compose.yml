# Phase 0 테스트 실행 환경 (docs/06). 도구 1의 분석 환경과는 별개.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "56432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: ../samples/order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      DDL_AUTO: create
      # 외부 의존은 mock 컨테이너로 redirect (docs/06)
      EXTERNAL_INVENTORY_URL: http://wiremock:8080
      # OTEL javaagent: baggage propagation만 사용 (트레이스 저장 없음)
      JAVA_TOOL_OPTIONS: "-javaagent:/agents/otel-javaagent.jar"
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_SERVICE_NAME: order-service
    volumes:
      - ./agents:/agents:ro
    ports:
      - "58080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started

  wiremock:
    image: wiremock/wiremock:3.13.0
    command: ["--global-response-templating"]
    ports:
      - "59091:8080"

  socket-mock:
    build: ../socket-mock-server
    ports:
      - "59099:9099"
      - "59000:9000"

  test-state-dashboard:
    build: ../test-state-dashboard
    environment:
      DASHBOARD_TTL_SECONDS: "300"
    ports:
      - "58099:8080"
