[versions]
# Toolchain
java = "17"
java-testlib-api = "8"

# Frameworks
spring-boot = "3.5.0"
spring-dep-mgmt = "1.1.6"

# Testing
junit = "5.11.0"
assertj = "3.26.3"
mockito = "5.14.0"
testcontainers = "1.20.4"
restassured = "5.5.0"
hamcrest = "3.0"
wiremock = "3.9.2"

# JSON
jackson = "2.18.2"

# Networking
netty = "4.1.115.Final"
okhttp = "4.12.0"

# Database
postgres = "42.7.4"
h2 = "2.3.232"
datasource-proxy = "1.10"
mybatis = "3.5.16"
bytebuddy = "1.15.10"
neo4j-driver = "5.26.0"
jacoco = "0.8.12"

# Utilities
ulid = "5.2.3"
slf4j = "2.0.16"
logback = "1.5.12"

[libraries]
# Jackson
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

# JUnit
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# AssertJ + Mockito
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

# Testcontainers
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-neo4j = { module = "org.testcontainers:neo4j", version.ref = "testcontainers" }
neo4j-driver = { module = "org.neo4j.driver:neo4j-java-driver", version.ref = "neo4j-driver" }

# JaCoCo runtime API (programmatic in-process coverage)
coverage-jacoco-core = { module = "org.jacoco:org.jacoco.core", version.ref = "jacoco" }

# RestAssured
restassured = { module = "io.rest-assured:rest-assured", version.ref = "restassured" }
restassured-json-path = { module = "io.rest-assured:json-path", version.ref = "restassured" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

# WireMock
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

# Netty
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }

# HTTP client (for dashboard reporter)
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# JDBC
postgres-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgres" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# SQL 캡처 (graph-rag-builder 분석 환경)
datasource-proxy = { module = "net.ttddyy:datasource-proxy", version.ref = "datasource-proxy" }
mybatis = { module = "org.mybatis:mybatis", version.ref = "mybatis" }
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
bytebuddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "bytebuddy" }

# Utilities
ulid-creator = { module = "com.github.f4b6a3:ulid-creator", version.ref = "ulid" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dep-mgmt = { id = "io.spring.dependency-management", version.ref = "spring-dep-mgmt" }

[bundles]
junit = ["junit-jupiter-api", "junit-jupiter-params"]
junit-runtime = ["junit-jupiter-engine"]
jackson = ["jackson-core", "jackson-databind", "jackson-annotations", "jackson-jsr310"]
testing-base = ["junit-jupiter", "assertj", "mockito", "mockito-junit"]
